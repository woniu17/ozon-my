server {
    # 同时匹配 yochylin.com 和 2.tencent.yochylin.com
    # 17443 端口仅此一个 server 块,未匹配 Host 也会落到这里
    server_name yochylin.com 2.tencent.yochylin.com;

    # Ozon 推送通知 -> ozon-webhook (3002)
    # 超时设短,Ozon 要求 5s 内响应
    location /webhook/ozon {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # 其他请求 -> erp-backend-lite (3001)
    location / {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    listen 17443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yochylin.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yochylin.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
