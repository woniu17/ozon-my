<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的妙手助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>我的妙手助手</h1>
      <p class="subtitle">质检单高亮 · 订单导入代理 · 拼多多登录同步</p>
    </header>

    <section class="section">
      <label class="label">质检单前缀</label>
      <p class="hint">订单号以任一前缀开头即为质检单,每行一个,留空恢复默认</p>
      <textarea
        id="prefixes"
        class="textarea"
        rows="4"
        placeholder="02131&#10;024785"
        spellcheck="false"
      ></textarea>

      <div class="actions">
        <button id="save" class="btn btn-primary">保存</button>
        <button id="reset" class="btn btn-ghost">恢复默认</button>
      </div>
    </section>

    <section class="section pdd-sync">
      <label class="label">拼多多登录同步</label>
      <p class="hint">把本浏览器的拼多多登录态同步给 ERP 后台(拼多多单点登录,ERP 侧永不登录)</p>
      <div class="pdd-account-row">
        <span class="pdd-account-label">ERP 后端</span>
        <select id="erp-backend" class="select"></select>
      </div>
      <div id="erp-auth-state" class="pdd-login-state">检测中…</div>
      <div class="erp-login-row" id="erp-login-row" hidden>
        <input id="erp-phone" class="input" placeholder="ERP 手机号" autocomplete="off" />
        <input id="erp-password" class="input" type="password" placeholder="密码" />
        <button id="erp-login-btn" class="btn btn-primary">登录</button>
      </div>
      <div id="pdd-login-state" class="pdd-login-state">检测中…</div>
      <div class="pdd-account-row">
        <span class="pdd-account-label">同步到账号</span>
        <select id="pdd-account" class="select"></select>
      </div>
      <div class="actions">
        <button id="pdd-sync" class="btn btn-primary" disabled>同步登录到 ERP</button>
      </div>
      <p class="hint" id="pdd-accounts-hint"></p>
    </section>

    <div id="toast" class="toast" hidden></div>

    <footer class="footer">
      <div>质检单匹配:</div>
      <code>erp.91miaoshou.com/order/package/index*</code>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
